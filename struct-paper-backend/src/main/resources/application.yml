server:
  port: 8080

spring:
  application:
    name: struct-paper-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

structpaper:
  latex:
    engine: auto
    timeout-seconds: 60
    auto-font-fallback: true
    xelatex-path: xelatex
    tectonic-path: ""

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# Actuator Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    vn.edu.vnu.structpaper: DEBUG
